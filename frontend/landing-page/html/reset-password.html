<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Redefinir senha | vigiAI</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">
<header class="top"><div class="wrap"><div class="logo">📄 vigi<span>AI</span></div><a class="btn site-link ghost" href="index.html">Página inicial</a></div></header>
<main class="auth-main"><section class="auth-shell auth-shell--single wrap">
  <div class="auth-card">
    <p class="eyebrow">Nova senha</p><h1>Redefina seu acesso</h1>
    <p class="muted">Escolha uma senha com pelo menos 8 caracteres.</p>
    <form id="resetForm" novalidate>
      <div class="field"><label for="password">Nova senha</label><input id="password" type="password" minlength="8" autocomplete="new-password" required><div class="err" data-error="password"></div></div>
      <div class="field"><label for="confirmPassword">Confirmar nova senha</label><input id="confirmPassword" type="password" autocomplete="new-password" required><div class="err" data-error="confirmPassword"></div></div>
      <button class="btn auth-submit" type="submit">Redefinir senha</button>
    </form>
    <div id="authMessage" class="msg" role="status" aria-live="polite" hidden></div>
    <p class="auth-links"><a href="account.html">Voltar para o login</a></p>
  </div>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-env.js"></script>
<script src="supabase-config.js"></script>
<script src="reset-password.js"></script>
</body>
</html>
