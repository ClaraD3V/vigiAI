<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recuperar senha | vigiAI</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">
<header class="top"><div class="wrap"><div class="logo">📄 vigi<span>AI</span></div><a class="btn site-link ghost" href="account.html">Voltar</a></div></header>
<main class="auth-main"><section class="auth-shell auth-shell--single wrap">
  <div class="auth-card">
    <p class="eyebrow">Recuperação de acesso</p>
    <h1>Esqueceu sua senha?</h1>
    <p class="muted">Informe seu e-mail e enviaremos instruções para criar uma nova senha.</p>
    <form id="forgotForm" novalidate>
      <div class="field"><label for="email">E-mail</label><input id="email" type="email" autocomplete="email" required><div class="err" data-error="email"></div></div>
      <button class="btn auth-submit" type="submit">Enviar instruções</button>
    </form>
    <div id="authMessage" class="msg" role="status" aria-live="polite" hidden></div>
    <p class="auth-links"><a href="account.html">Voltar para o login</a></p>
  </div>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="forgot-password.js"></script>
</body>
</html>
